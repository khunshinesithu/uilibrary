<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile card</title>
  <!--
    Source: starter example
    Notes:  The avatar is plain initials on a gradient, so it needs no image file.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f4;
      color: #1b1b1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #f1f1f3; }
    }

    .profile {
      width: min(280px, 100%);
      padding: 20px;
      border: 1px solid #e4e4e0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    }
    .profile__head { display: flex; align-items: center; gap: 12px; }
    .avatar {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      font-weight: 600;
    }
    .profile h2 { margin: 0; font-size: 16px; }
    .profile .role { margin: 0; font-size: 13px; color: #6b6b75; }
    .profile .bio { margin: 14px 0; font-size: 14px; line-height: 1.5; color: #45454d; }

    .stats { display: flex; gap: 20px; padding: 12px 0; border-block: 1px solid #eeeeea; }
    .stats strong { display: block; font-size: 15px; }
    .stats span { font-size: 12px; color: #6b6b75; }

    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions button {
      flex: 1;
      height: 34px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }
    .actions .primary { border: 0; background: #1b1b1f; color: #fff; }
    .actions .secondary { border: 1px solid #d9d9d4; background: transparent; color: inherit; }

    @media (prefers-color-scheme: dark) {
      .profile { background: #1c1c20; border-color: #2c2c32; box-shadow: none; }
      .profile .role, .stats span { color: #9a9aa5; }
      .profile .bio { color: #c4c4cc; }
      .stats { border-color: #2c2c32; }
      .actions .primary { background: #f1f1f3; color: #1b1b1f; }
      .actions .secondary { border-color: #34343b; }
    }
  </style>
</head>
<body>
  <article class="profile">
    <div class="profile__head">
      <div class="avatar" aria-hidden="true">AM</div>
      <div>
        <h2>Alex Morgan</h2>
        <p class="role">Product designer</p>
      </div>
    </div>
    <p class="bio">Designs calm, simple interfaces. Likes grids, good type and small details.</p>
    <div class="stats">
      <div><strong>128</strong><span>Shots</span></div>
      <div><strong>4.2k</strong><span>Followers</span></div>
      <div><strong>312</strong><span>Following</span></div>
    </div>
    <div class="actions">
      <button class="primary">Follow</button>
      <button class="secondary">Message</button>
    </div>
  </article>
</body>
</html>

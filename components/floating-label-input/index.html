<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floating label input</title>
  <!--
    Source: starter example
    Notes:  CSS only. The trick is placeholder=" " (one space) plus
            :placeholder-shown, which tells us if the field is empty.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f4;
      color: #1b1b1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #f1f1f3; }
    }

    .stack { display: grid; gap: 16px; width: min(300px, 100%); }

    .field { position: relative; }
    .field input {
      width: 100%;
      height: 52px;
      padding: 20px 14px 6px;
      box-sizing: border-box;
      border: 1px solid #d0d0cb;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b6b75;
      font-size: 15px;
      pointer-events: none;
      transition: top .15s ease, font-size .15s ease, color .15s ease;
    }
    .field input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .18);
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: 15px;
      font-size: 12px;
    }
    .field input:focus + label { color: #4f46e5; }

    @media (prefers-color-scheme: dark) {
      .field input { background: #1c1c20; border-color: #34343b; }
      .field label { color: #9a9aa5; }
      .field input:focus { border-color: #8b85ff; box-shadow: 0 0 0 3px rgba(139, 133, 255, .22); }
      .field input:focus + label { color: #8b85ff; }
    }
  </style>
</head>
<body>
  <form class="stack" onsubmit="return false">
    <div class="field">
      <input id="name" type="text" placeholder=" " autocomplete="name">
      <label for="name">Full name</label>
    </div>
    <div class="field">
      <input id="email" type="email" placeholder=" " value="hello@example.com" autocomplete="email">
      <label for="email">Email</label>
    </div>
  </form>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggle switch</title>
  <!--
    Source: starter example
    Notes:  A real <input type="checkbox" role="switch"> under the hood,
            so Tab + Space work and screen readers say "on/off".
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f4;
      color: #1b1b1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #f1f1f3; }
    }

    .stack { display: grid; gap: 16px; }

    .switch {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      cursor: pointer;
    }
    .switch input {
      appearance: none;
      position: relative;
      width: 44px;
      height: 26px;
      margin: 0;
      border-radius: 999px;
      background: #c9c9c4;
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch input::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
      transition: transform .2s cubic-bezier(.3, .7, .4, 1.3);
    }
    .switch input:checked { background: #4f46e5; }
    .switch input:checked::before { transform: translateX(18px); }
    .switch input:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
    .switch input:disabled { opacity: .5; cursor: not-allowed; }

    @media (prefers-color-scheme: dark) {
      .switch input { background: #3a3a42; }
      .switch input:checked { background: #8b85ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .switch input, .switch input::before { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stack">
    <label class="switch"><input type="checkbox" role="switch" checked> Notifications</label>
    <label class="switch"><input type="checkbox" role="switch"> Dark mode</label>
    <label class="switch"><input type="checkbox" role="switch" disabled> Disabled</label>
  </div>
</body>
</html>

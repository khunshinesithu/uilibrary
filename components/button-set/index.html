<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button set</title>
  <!--
    Source: starter example
    Notes:  Four button styles that share one base class. Press effect uses transform only.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f4;
      color: #1b1b1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #f1f1f3; }
    }

    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    .btn {
      --btn-bg: #4f46e5;
      --btn-fg: #fff;
      --btn-border: transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 18px;
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, background .12s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px) scale(.98); }
    .btn:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }

    .btn--secondary { --btn-bg: #fff; --btn-fg: #1b1b1f; --btn-border: #d9d9d4; }
    .btn--ghost { --btn-bg: transparent; --btn-fg: #4f46e5; }
    .btn--ghost:hover { --btn-bg: rgba(79, 70, 229, .1); filter: none; }
    .btn--icon { width: 40px; padding: 0; justify-content: center; border-radius: 50%; }

    @media (prefers-color-scheme: dark) {
      .btn--secondary { --btn-bg: #1c1c20; --btn-fg: #f1f1f3; --btn-border: #34343b; }
      .btn--ghost { --btn-fg: #8b85ff; }
    }

    .btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="row">
    <button class="btn">Primary</button>
    <button class="btn btn--secondary">Secondary</button>
    <button class="btn btn--ghost">Ghost</button>
    <button class="btn btn--icon" aria-label="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</body>
</html>
